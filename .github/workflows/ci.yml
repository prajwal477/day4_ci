name: React CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: react-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build React App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint --if-present

      - name: Build React application
        run: npm run build

      - name: Upload build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: dist/
          retention-days:
